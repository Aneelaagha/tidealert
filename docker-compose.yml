services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tidealert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tidealert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tidealert}
      POSTGRES_DB: ${POSTGRES_DB:-tidealert}
    ports:
      - "5433:5432"
    volumes:
      - tidealert_pgdata:/var/lib/postgresql/data

volumes:
  tidealert_pgdata:
