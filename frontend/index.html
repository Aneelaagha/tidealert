<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TideAlert Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1f2328; --muted: #5f6b7a; --line: #d8dde3;
      --fresh: #1a7f37; --stale: #b42318; --nodata: #6e7781; --event: #0b5cad;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
                 color: var(--text); background: var(--bg); }
    body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px;
             background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0 8px 0 0; }
    select, input[type=range] { font: inherit; }
    #run { max-width: 340px; }
    .badge { font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; color: #fff; }
    .badge.replay { background: #6f42c1; } .badge.scenario { background: #bf8700; } .badge.live { background: #b42318; }
    .badge.unstyled { background: #ff00ff; }
    #time { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 240px; }
    #time input { flex: 1; }
    #at-label { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #status { color: var(--muted); font-size: 12px; }
    #banner { padding: 6px 16px; background: #fff8e6; border-bottom: 1px solid var(--line); font-size: 13px;
              display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
    .chip { display: inline-flex; gap: 6px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .fresh { background: var(--fresh); } .stale { background: var(--stale); }
    .no_data { background: var(--nodata); } .event_driven { background: var(--event); }
    .caveat { color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
    #map { min-height: 0; }
    aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 16px; }
    aside h2 { font-size: 14px; margin: 12px 0 6px; }
    aside h2:first-child { margin-top: 0; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .sw { width: 22px; height: 14px; border: 1px solid #0003; flex: none; }
    .sw.line { height: 0; border: none; border-top-width: 3px; border-top-style: solid; }
    .sw.hatch { background: repeating-linear-gradient(45deg, #5f6b7a 0 2px, transparent 2px 6px); border: 2px dashed #5f6b7a; }
    .muted { color: var(--muted); }
    .warn { color: #b42318; }
    .case { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0; }
    .case p { margin: 4px 0; }
    .contrib { font-size: 12px; border-top: 1px dotted var(--line); padding-top: 4px; margin-top: 4px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #eef1f4; margin-right: 4px; }
    .tag.supports { background: #ffe1e1; } .tag.contradicts { background: #dff3e4; }
    .tag.neutral, .tag.procedural { background: #eef1f4; }
    .task { border-left: 3px solid #1565c0; padding: 4px 8px; margin: 8px 0; background: #f6f9fe; }
    .task p { margin: 3px 0; }
    .history { padding-left: 16px; margin: 4px 0; font-size: 12px; }
    .history li { margin: 4px 0; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 4px 0; }
    dt { color: var(--muted); } dd { margin: 0; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
      aside { border-left: none; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>TideAlert</h1>
    <label>Run <select id="run"></select></label>
    <span id="mode" class="badge"></span>
    <div id="time">
      <input id="slider" type="range" min="0" max="0" step="1" value="0" aria-label="Time">
      <span id="at-label"></span>
    </div>
    <span id="status"></span>
  </header>
  <div id="banner" aria-live="polite"></div>
  <main>
    <div id="map"></div>
    <aside>
      <h2>Legend</h2>
      <div id="legend"></div>
      <h2>Zone</h2>
      <div id="detail" class="muted">Click a zone to see its Cases and the evidence behind them.</div>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="map.js"></script>
</body>
</html>
